# Render Blueprint for a Goroada staging environment.
# Creates a Postgres database and a Node web service wired to it.
databases:
  - name: goroada-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: goroada-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: claude/goroada-travel-platform-lsaz7f
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /trips/find
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: goroada-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
